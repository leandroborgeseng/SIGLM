# Configuração padrão para o serviço API no Railway.
# O serviço WEB deve sobrescrever no painel: Dockerfile Path = apps/web/Dockerfile

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = [
  "apps/api/**",
  "package.json",
  "package-lock.json",
]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/api/health"
healthcheckTimeout = 120
