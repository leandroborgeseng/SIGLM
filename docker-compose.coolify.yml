# SIGLM — stack completo para Coolify (Postgres + API + Web).
# Um único recurso Docker Compose no Coolify; deploy automático via Git na branch main.
#
# IMPORTANTE (Coolify): marque TODAS as variáveis como "Available at Buildtime"
# (Build Variable) na aba Environment — senão o build falha na interpolação.
# Veja COOLIFY.md e .env.coolify.example

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siglm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siglm_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-siglm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-siglm} -d ${POSTGRES_DB:-siglm}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-siglm}:${POSTGRES_PASSWORD:-siglm_change_me}@postgres:5432/${POSTGRES_DB:-siglm}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_jwt_refresh}
      CORS_ORIGIN: ${CORS_ORIGIN:-${SERVICE_URL_WEB:-http://localhost:3000}}
      RUN_SEED: ${RUN_SEED:-false}
      S3_BACKUP_ENABLED: ${S3_BACKUP_ENABLED:-false}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_BACKUP_REGION: ${S3_BACKUP_REGION:-}
      S3_BACKUP_ACCESS_KEY_ID: ${S3_BACKUP_ACCESS_KEY_ID:-}
      S3_BACKUP_SECRET_ACCESS_KEY: ${S3_BACKUP_SECRET_ACCESS_KEY:-}
      S3_BACKUP_ENDPOINT: ${S3_BACKUP_ENDPOINT:-}
      S3_BACKUP_FORCE_PATH_STYLE: ${S3_BACKUP_FORCE_PATH_STYLE:-true}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-siglm/backups}
      S3_BACKUP_CRON: ${S3_BACKUP_CRON:-0 3 * * *}
      S3_BACKUP_TZ: ${S3_BACKUP_TZ:-America/Sao_Paulo}
      S3_BACKUP_KEEP_DAILY: ${S3_BACKUP_KEEP_DAILY:-7}
      S3_BACKUP_KEEP_WEEKLY: ${S3_BACKUP_KEEP_WEEKLY:-5}
      S3_BACKUP_KEEP_MONTHLY: ${S3_BACKUP_KEEP_MONTHLY:-12}
    volumes:
      - api_uploads:/app/apps/api/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    expose:
      - '3001'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build-time: NEXT_PUBLIC_API_URL, API_URL ou SERVICE_URL_API (Coolify injeta automaticamente)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${API_URL:-${SERVICE_URL_API:-http://localhost:3001}/api}}
        NEXT_PUBLIC_STAGING_GATE: ${NEXT_PUBLIC_STAGING_GATE:-false}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:3001/api
      API_URL: ${API_URL:-${NEXT_PUBLIC_API_URL:-${SERVICE_URL_API:-http://localhost:3001}/api}}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${API_URL:-${SERVICE_URL_API:-http://localhost:3001}/api}}
      NEXT_PUBLIC_STAGING_GATE: ${NEXT_PUBLIC_STAGING_GATE:-false}
      STAGING_ACCESS_PASSWORD: ${STAGING_ACCESS_PASSWORD:-}
    expose:
      - '3000'

volumes:
  pgdata:
  api_uploads:
