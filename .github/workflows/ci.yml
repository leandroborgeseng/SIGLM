name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate --workspace=@leis-municipais/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      - name: Validar migrations (migrate deploy)
        run: npm run db:migrate:deploy --workspace=@leis-municipais/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      - name: Build API
        run: npm run build --workspace=@leis-municipais/api

      - name: Build Web
        run: npm run build --workspace=@leis-municipais/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem API
        run: docker build -f apps/api/Dockerfile -t leis-municipais-api .

      - name: Build imagem Web
        run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001/api -t leis-municipais-web .
