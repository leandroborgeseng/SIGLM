# Serviço WEB — no Railway: Settings → Config File = apps/web/railway.toml
# NÃO precisa de DATABASE_URL

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = [
  "apps/web/**",
  "package.json",
  "package-lock.json",
]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
