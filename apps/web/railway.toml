# Use este serviço com Root Directory = apps/web NÃO funciona (monorepo).
# No Railway: serviço "web" → Settings → Build → Dockerfile Path = apps/web/Dockerfile

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = [
  "apps/web/**",
  "package.json",
  "package-lock.json",
]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
